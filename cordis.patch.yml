# Bundled into a DSH profile by `dsh plugin --profile <name> add @colinagent/dsh-telegram`.
#
# The bundle is the install unit; this layer is what actually mounts the bridge
# inside the Host. `inject` in src/host/plugin.ts keeps the row disabled until
# the session and workspace controllers exist, so no ordering assumption lives
# in this file.
- insert:
    - id: dsh-telegram
      name: '@colinagent/dsh-telegram/plugin'
